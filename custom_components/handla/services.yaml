set_active_list:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          filter:
            integration: ica
            domain: todo
          exclude_entities:
            - todo.ica_favorite_articles

create_list:
  fields:
    title:
      required: false
      selector:
        text:
    comment:
      required: false
      selector:
        text:
    set_active:
      required: false
      default: true
      selector:
        boolean:

delete_list:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          filter:
            integration: ica
            domain: todo
          exclude_entities:
            - todo.ica_favorite_articles

add_item:
  fields:
    entity_id:
      required: false
      selector:
        entity:
          filter:
            integration: ica
            domain: todo
          exclude_entities:
            - todo.ica_favorite_articles
    item:
      required: true
      example: "2 st gurka"
      selector:
        text:
    confirm_duplicate:
      required: false
      default: false
      selector:
        boolean:

tick_item:
  fields:
    entity_id:
      required: false
      selector:
        entity:
          filter:
            integration: ica
            domain: todo
          exclude_entities:
            - todo.ica_favorite_articles
    item:
      required: true
      selector:
        text:
    ticked:
      required: false
      default: true
      selector:
        boolean:

remove_item:
  fields:
    entity_id:
      required: false
      selector:
        entity:
          filter:
            integration: ica
            domain: todo
          exclude_entities:
            - todo.ica_favorite_articles
    item:
      required: true
      selector:
        text:

clear_ticked:
  fields:
    entity_id:
      required: false
      selector:
        entity:
          filter:
            integration: ica
            domain: todo
          exclude_entities:
            - todo.ica_favorite_articles

get_top_items:
  fields:
    limit:
      required: false
      default: 12
      selector:
        number:
          min: 1
          max: 500
          mode: box

remove_quick_item:
  fields:
    item:
      required: true
      selector:
        text:

add_quick_item:
  fields:
    item:
      required: true
      selector:
        text:

merge_quick_items:
  fields:
    sources:
      required: true
      selector:
        object:
    target:
      required: true
      selector:
        text:

suggest_list_name:
  fields: {}

ai_extract_items:
  fields:
    text:
      required: true
      selector:
        text:
          multiline: true
    entity_id:
      required: false
      selector:
        entity:
          filter:
            integration: ica
            domain: todo
          exclude_entities:
            - todo.ica_favorite_articles
