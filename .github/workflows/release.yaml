name: Release

# Pushing a tag vMAJOR.MINOR.PATCH (a suffix such as -beta1 makes it a pre-release) tests
# the code, builds the card, stamps the version into the integration and creates a
# GitHub release with handla.zip attached, which HACS installs.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write # to create the release and attach the zip

jobs:
  test:
    name: Tests must pass before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_dev.txt
      - run: pip install -r requirements_dev.txt
      - run: ruff check .
      - run: mypy custom_components
      - run: pytest tests/ -v

  asset:
    name: Build and publish handla.zip
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to check that the tag is on main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "The tag must look like v1.2.3, got: $TAG"; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tag $TAG is not on main. Release from main only."; exit 1
          fi
      - name: Test and build the card with the release version
        working-directory: frontend
        run: |
          npm ci
          npm pkg set version="${TAG#v}"
          npm run lint
          npm test
          npm run build
      - name: Package the integration
        run: ./scripts/package-release.sh "$TAG"
      - name: Create the release and attach handla.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$TAG" in *-*) flag="--prerelease" ;; *) flag="" ;; esac
          gh release create "$TAG" dist/handla.zip --title "$TAG" --generate-notes $flag
